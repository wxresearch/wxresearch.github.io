name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'articles/**'
      - 'scripts/generate_sitemap.py'
      - '.github/workflows/update-sitemap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Commit sitemap changes if needed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automatically update sitemap"
          git push
